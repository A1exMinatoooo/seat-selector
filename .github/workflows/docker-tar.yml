name: Build Docker tar packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker tar package
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          tags: |
            pick-your-seat:latest
            pick-your-seat:${{ github.sha }}
          outputs: type=docker,dest=/tmp/pick-your-seat-${{ github.sha }}-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Upload Docker tar package
        uses: actions/upload-artifact@v4
        with:
          name: pick-your-seat-${{ github.sha }}-${{ matrix.arch }}
          path: /tmp/pick-your-seat-${{ github.sha }}-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14
